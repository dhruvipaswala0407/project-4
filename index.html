<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product Store</title>
    <!-- icon -->
    <link rel="icon" href="./assests/imges/shopping-cart.png">
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- remix-icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <!-- custom css -->
    <link rel="stylesheet" href="./assests/css/style.css">
    <link rel="stylesheet" href="./assests/css/media.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid text-bg-primary">
                <a class="navbar-brand text-white col-2 p-2" href="#">My Product Store</a>
                <button class="navbar-toggler  text-white" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="text-white"><i class="ri-menu-fill"></i></span>
                </button>
                <div class="collapse navbar-collapse col-10" id="navbarText">
                    <ul class="navbar-nav me-auto mb-lg-0 col-8 d-flex justify-content-center">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Product</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">About</a>
                        </li>
                    </ul>
                    <span class="navbar-text text-white col-2 d-flex justify-content-evenly">
                        <i class="ri-heart-3-line"></i>
                        <i class="ri-shopping-cart-line"></i>
                        <i class="ri-search-line"></i>
                    </span>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="fram raound">
            <div class="card text-bg-dark">
                <img src="https://media.post.rvohealth.io/wp-content/uploads/2020/08/beauty-skin-care-cosmetics_thumb.jpg"
                    class="card-img" alt="...">
                <div class="card-img-overlay p-5 mt-5">
                    <h5 class="card-title d-flex align-itam-center justify-content-center fw-bold">My Product Store</h5>
                    <p class="card-text d-flex align-itam-center justify-content-center mt-3 fw-semibold">Treat your makeup like jewelry for the face. Play with colors, shapes, structure—it can transform you.</p>
                    <p class="card-text d-flex align-itam-center justify-content-center mb-lg-0 mt-5"><button class="btn btn-primary">Shop Now</button></p>
                </div>
            </div>
        </div>
        <section class="p-3">
            <div class="container">
                <div class="row">
                    <div class="product-sec">
                        <div class="col-12">
                            <div class="product d-flex flex-wrap row-gap-5">
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- custom js -->
    <script src="./assests/js/type.js"></script>
</body>

</html>
